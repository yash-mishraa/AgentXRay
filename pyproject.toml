[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentxray"
version = "0.1.0"
description = "Investigating and reverse-engineering the observable behaviour of AI agents through controlled experiments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentXRay Contributors" }
]
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agentxray = "agentxray.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/agentxray", "benchmarks"]
