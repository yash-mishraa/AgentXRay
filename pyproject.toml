[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentxray"
version = "0.1.0"
description = "Black-box causal failure-condition minimization for tool-calling AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentXRay Contributors" }
]
keywords = [
    "ai-agents",
    "tool-calling",
    "debugging",
    "delta-debugging",
    "fault-localization",
    "causality",
    "minimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/yash-mishraa/AgentXRay"
Documentation = "https://github.com/yash-mishraa/AgentXRay/tree/main/docs"
Repository = "https://github.com/yash-mishraa/AgentXRay"
Issues = "https://github.com/yash-mishraa/AgentXRay/issues"
"Hugging Face Space" = "https://huggingface.co/spaces/meowshra/AgentXRay"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
demo = [
    "gradio>=4.0.0",
    "streamlit>=1.35.0",
]

[project.scripts]
agentxray = "agentxray.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/agentxray", "benchmarks"]
